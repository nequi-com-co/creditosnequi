<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta aprobada - Nequi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #200020;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .check {
      width: 70px;
      height: 70px;
      background: #00C853;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
      color: white;
    }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { font-size: 15px; color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="check">✓</div>
    <h1>¡Tarjeta validada correctamente!</h1>
    <p>Tu crédito está siendo procesado.<br>Recibirás el desembolso en breve.</p>
  </div>
</body>
</html>
